---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    # The el8 scenario sets kea_api_mode: ctrl_agent to cover kea-ctrl-agent.
    ctrl_agent: "{{ (kea_api_mode | default('auto')) == 'ctrl_agent' }}"
    api_urls: >-
      {{ {'dhcp4': 'http://127.0.0.1:8000/', 'dhcp6': 'http://127.0.0.1:8000/', 'd2': 'http://127.0.0.1:8000/'}
         if ctrl_agent | bool else
         {'dhcp4': 'http://127.0.0.1:8004/', 'dhcp6': 'http://127.0.0.1:8006/', 'd2': 'http://127.0.0.1:8053/'} }}
    kea_daemons: "{{ ['kea-dhcp4', 'kea-dhcp6', 'kea-dhcp-ddns'] + (['kea-ctrl-agent'] if ctrl_agent | bool else []) }}"
    api_user: admin
    api_password: molecule-secret
  tasks:
    - name: Collect service state
      ansible.builtin.service_facts:

    - name: Assert Kea daemons are running
      ansible.builtin.assert:
        that: ansible_facts.services[item ~ '.service'].state == 'running'
        fail_msg: "{{ item }} is not running"
      loop: "{{ kea_daemons }}"

    - name: Assert kea-ctrl-agent is stopped when the daemons serve the API
      ansible.builtin.assert:
        that: ansible_facts.services['kea-ctrl-agent.service'].state | default('stopped') != 'running'
        fail_msg: kea-ctrl-agent is running although the daemons serve the API
      when: not ctrl_agent | bool

    - name: Re-check configuration files
      ansible.builtin.command: "{{ item.bin }} -t /etc/kea/{{ item.conf }}"
      loop:
        - { bin: kea-dhcp4, conf: kea-dhcp4.conf }
        - { bin: kea-dhcp6, conf: kea-dhcp6.conf }
        - { bin: kea-dhcp-ddns, conf: kea-dhcp-ddns.conf }
        - { bin: kea-ctrl-agent, conf: kea-ctrl-agent.conf }
      when: item.bin in kea_daemons
      changed_when: false

    - name: API rejects requests without credentials
      ansible.builtin.uri:
        url: "{{ api_urls.dhcp4 }}"
        method: POST
        body_format: json
        body: { command: status-get, service: [dhcp4] }
        status_code: 401

    - name: Query every daemon through the API
      ansible.builtin.uri:
        url: "{{ api_urls[item] }}"
        method: POST
        url_username: "{{ api_user }}"
        url_password: "{{ api_password }}"
        force_basic_auth: true
        body_format: json
        body: { command: status-get, service: ["{{ item }}"] }
      register: status
      failed_when: status.json[0].result != 0
      loop: [dhcp4, dhcp6, d2]

    - name: Fetch the running DHCPv4 configuration
      ansible.builtin.uri:
        url: "{{ api_urls.dhcp4 }}"
        method: POST
        url_username: "{{ api_user }}"
        url_password: "{{ api_password }}"
        force_basic_auth: true
        body_format: json
        body: { command: config-get, service: [dhcp4] }
      register: config4

    - name: Assert PXE classes, DDNS and hooks are active
      ansible.builtin.assert:
        that:
          - "'PXE_UEFI_X64' in classes"
          - "'PXE_IPXE' in classes"
          - "'PXE_HTTP_X64' in classes"
          - dhcp4['dhcp-ddns']['enable-updates']
          - dhcp4['multi-threading']['enable-multi-threading']
          - hooks | select('search', 'libdhcp_host_cmds.so') | list | length == 1
          - hooks | select('search', 'libdhcp_legal_log.so') | list | length == 1
      vars:
        dhcp4: "{{ config4.json[0].arguments.Dhcp4 }}"
        classes: "{{ dhcp4['client-classes'] | map(attribute='name') | list }}"
        hooks: "{{ dhcp4['hooks-libraries'] | map(attribute='library') | list }}"

    - name: Assert ping check and DHCPv4 lease times
      ansible.builtin.assert:
        that:
          # Kea wants ping_check loaded before lease_cmds.
          - libraries.index('libdhcp_ping_check.so') < libraries.index('libdhcp_lease_cmds.so')
          - ping['parameters']['enable-ping-check']
          - ping['parameters']['reply-timeout'] == 200
          - dhcp4['offer-lifetime'] == 60
          - dhcp4['min-valid-lifetime'] == 2000
          - dhcp4['max-valid-lifetime'] == 8000
          - subnet2['valid-lifetime'] == 86400
          - subnet2['min-valid-lifetime'] == 3600
          - subnet2['max-valid-lifetime'] == 172800
          - subnet2['renew-timer'] == 43200
          - subnet2['rebind-timer'] == 75600
          - not subnet2['user-context']['enable-ping-check']
          - "'192.0.2.124' in (dhcp4['option-data'] | selectattr('name', 'equalto', 'ntp-servers') | first)['data']"
          - subnet2_ntp['data'] == '198.51.100.1'
          - subnet2_ntp['always-send']
          - "'domain-search' in dhcp4['option-data'] | map(attribute='name') | list"
          - >-
            subnet2['option-data'] | map(attribute='name') | list
            is superset(['routers', 'domain-name-servers', 'domain-name', 'domain-search'])
      vars:
        dhcp4: "{{ config4.json[0].arguments.Dhcp4 }}"
        libraries: "{{ dhcp4['hooks-libraries'] | map(attribute='library') | map('basename') | list }}"
        ping: "{{ dhcp4['hooks-libraries'][libraries.index('libdhcp_ping_check.so')] }}"
        subnet2: "{{ dhcp4.subnet4 | selectattr('id', 'equalto', 2) | first }}"
        subnet2_ntp: "{{ subnet2['option-data'] | selectattr('name', 'equalto', 'ntp-servers') | first }}"

    - name: Read kea-dhcp4's effective capabilities
      ansible.builtin.shell:
        cmd: set -o pipefail; grep CapEff /proc/$(pidof kea-dhcp4)/status | awk '{print $2}'
        executable: /bin/bash
      register: capeff
      changed_when: false

    - name: Assert kea-dhcp4 can open raw sockets for ping check
      ansible.builtin.assert:
        # CAP_NET_RAW is capability bit 13.
        that: (capeff.stdout | int(base=16)) // 8192 % 2 == 1
        fail_msg: "kea-dhcp4 lacks CAP_NET_RAW (CapEff {{ capeff.stdout }})"

    - name: Fetch the running DHCPv6 and DDNS configurations
      ansible.builtin.uri:
        url: "{{ api_urls[item] }}"
        method: POST
        url_username: "{{ api_user }}"
        url_password: "{{ api_password }}"
        force_basic_auth: true
        body_format: json
        body: { command: config-get, service: ["{{ item }}"] }
      register: config_v6_d2
      loop: [dhcp6, d2]

    - name: Assert DHCPv6 lease times and IPv6 dynamic DNS
      ansible.builtin.assert:
        that:
          - dhcp6['min-valid-lifetime'] == 2000
          - dhcp6['max-valid-lifetime'] == 8000
          - subnet2['valid-lifetime'] == 86400
          - subnet2['preferred-lifetime'] == 43200
          - subnet2['min-preferred-lifetime'] == 1800
          - subnet2['max-preferred-lifetime'] == 86400
          - subnet2['renew-timer'] == 21600
          - subnet2['rebind-timer'] == 34560
          - "'2001:db8::124' in (dhcp6['option-data'] | selectattr('name', 'equalto', 'sntp-servers') | first)['data']"
          - dhcp6['option-data'] | selectattr('name', 'equalto', 'ntp-server') | list | length == 1
          - >-
            dhcp6['option-data'] | map(attribute='name') | list
            is superset(['dns-servers', 'domain-search'])
          - >-
            (dhcp6['option-data'] | selectattr('name', 'equalto', 'ntp-server-address') | first)['space']
            == 'v6-ntp-server-suboptions'
          - "'::1' in d2['forward-ddns']['ddns-domains'][0]['dns-servers'] | map(attribute='ip-address') | list"
          - v6zone['dns-servers'] | length == 1
          - v6zone['dns-servers'][0]['ip-address'] == '::1'
          - v6zone['dns-servers'][0]['port'] == 5353
      vars:
        dhcp6: "{{ config_v6_d2.results[0].json[0].arguments.Dhcp6 }}"
        d2: "{{ config_v6_d2.results[1].json[0].arguments.DhcpDdns }}"
        subnet2: "{{ dhcp6.subnet6 | selectattr('id', 'equalto', 2) | first }}"
        v6zone: >-
          {{ d2['reverse-ddns']['ddns-domains']
             | selectattr('name', 'equalto', '1.0.0.0.8.b.d.0.1.0.0.2.ip6.arpa.') | first }}

    - name: Look up a DHCPv4 reservation through host_cmds
      ansible.builtin.uri:
        url: "{{ api_urls.dhcp4 }}"
        method: POST
        url_username: "{{ api_user }}"
        url_password: "{{ api_password }}"
        force_basic_auth: true
        body_format: json
        body:
          command: reservation-get
          service: [dhcp4]
          arguments: { subnet-id: 1, identifier-type: hw-address, identifier: "aa:bb:cc:dd:ee:01" }
      register: res4
      failed_when: res4.json[0].result != 0 or res4.json[0].arguments['ip-address'] != '192.0.2.10'

    - name: Look up a DHCPv6 reservation through host_cmds
      ansible.builtin.uri:
        url: "{{ api_urls.dhcp6 }}"
        method: POST
        url_username: "{{ api_user }}"
        url_password: "{{ api_password }}"
        force_basic_auth: true
        body_format: json
        body:
          command: reservation-get
          service: [dhcp6]
          arguments: { subnet-id: 1, identifier-type: duid, identifier: "01:02:03:04:05:0a:0b:0c:0d:0e" }
      register: res6
      failed_when: res6.json[0].result != 0 or '2001:db8:1::10' not in res6.json[0].arguments['ip-addresses']

    - name: Add and fetch a lease through lease_cmds
      ansible.builtin.uri:
        url: "{{ api_urls.dhcp4 }}"
        method: POST
        url_username: "{{ api_user }}"
        url_password: "{{ api_password }}"
        force_basic_auth: true
        body_format: json
        body:
          command: "{{ item.command }}"
          service: [dhcp4]
          arguments: "{{ item.arguments }}"
      register: lease
      # lease4-del answers 3 (empty) when there was nothing to delete.
      failed_when: lease.json[0].result not in ([0, 3] if item.command == 'lease4-del' else [0])
      loop:
        - { command: lease4-del, arguments: { ip-address: 192.0.2.150 } }
        - { command: lease4-add, arguments: { ip-address: 192.0.2.150, hw-address: "aa:bb:cc:dd:ee:99" } }
        - { command: lease4-get, arguments: { ip-address: 192.0.2.150 } }
      loop_control:
        label: "{{ item.command }}"

    - name: Check log files are written
      ansible.builtin.stat:
        path: "/var/log/kea/{{ item }}"
      register: logs
      failed_when: not logs.stat.exists
      loop: "{{ kea_daemons | map('regex_replace', '$', '.log') | list }}"

    - name: Check the systemd tuning drop-in is applied
      ansible.builtin.systemd_service:
        name: kea-dhcp4
      register: unit
      failed_when: unit.status.LimitNOFILE != '65536'

    - name: Read the fapolicyd trust file
      ansible.builtin.slurp:
        src: /etc/fapolicyd/trust.d/kea-dhcp
      register: trust

    - name: Hash the trusted helper
      ansible.builtin.stat:
        path: /usr/local/bin/kea-molecule-helper
        checksum_algorithm: sha256
      register: helper

    - name: Assert the trust entry matches the file
      ansible.builtin.assert:
        that: >-
          '/usr/local/bin/kea-molecule-helper ' ~ helper.stat.size ~ ' ' ~ helper.stat.checksum
          in (trust.content | b64decode)

    - name: Start a non-Kea listener on a spare port
      ansible.builtin.shell: setsid nohup python3 -m http.server 8099 --bind 127.0.0.1 >/dev/null 2>&1 & echo $!
      changed_when: false
      register: dummy_listener

    - name: Wait for the listener
      ansible.builtin.wait_for:
        port: 8099
        host: 127.0.0.1
        timeout: 30

    - name: The port check refuses a port another service holds
      block:
        - name: Run the role's port check with the dhcp4 API on that port
          ansible.builtin.include_role:
            name: ansible-role-kea_dhcp
            tasks_from: ports.yml
          vars:
            __kea_api_daemon: true
            kea_api_dhcp4_port: 8099

        - name: The check should not have passed
          ansible.builtin.fail:
            msg: The port check missed the listener on 8099

      rescue:
        - name: Assert the check named the busy port
          ansible.builtin.assert:
            that:
              - "'already in use' in ansible_failed_result.msg"
              - "':8099' in ansible_failed_result.msg"
            fail_msg: "Unexpected failure: {{ ansible_failed_result.msg | default(ansible_failed_result) }}"

      always:
        - name: Stop the listener
          ansible.builtin.command: kill {{ dummy_listener.stdout }}
          changed_when: false
          failed_when: false

    - name: The port check passes for Kea's own listeners
      ansible.builtin.include_role:
        name: ansible-role-kea_dhcp
        tasks_from: ports.yml
      vars:
        __kea_api_daemon: "{{ not ctrl_agent | bool }}"
        __kea_ctrl_agent_active: "{{ ctrl_agent | bool }}"
        kea_dhcp6_enabled: true
        kea_ddns_enabled: true
