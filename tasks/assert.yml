---
- name: Assert supported platform
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'RedHat'
      - ansible_facts['distribution_major_version'] in __kea_supported_major_versions
    fail_msg: >-
      This role supports RHEL-compatible systems 8, 9 and 10, not
      {{ ansible_facts['distribution'] }} {{ ansible_facts['distribution_version'] }}.
    quiet: true

- name: Assert install source
  ansible.builtin.assert:
    that: kea_install_source in __kea_sources
    fail_msg: "kea_install_source must be one of {{ __kea_sources.keys() | list }}"
    quiet: true

- name: Assert no certificate variables from earlier releases are set
  ansible.builtin.assert:
    that: lookup('ansible.builtin.varnames', __kea_removed_tls_variables, wantlist=true) | length == 0
    fail_msg: >-
      ssl_certificates replaces the kea_api_tls_*, kea_ctrl_agent_tls_* and kea_ha_tls_* cert_content
      and key_content variables. Move the certificate and key to an entry in ssl_certificates.
    quiet: true

# These run on the list as a whole, with filters, so that no result holds a key.
- name: Assert the supplied certificates
  when: __kea_tls_uses | length > 0
  block:
    - name: Assert the supplied certificate entries
      ansible.builtin.assert:
        that:
          - ssl_certificates | selectattr('certificate.content', 'undefined') | list | length == 0
          - ssl_certificates | selectattr('key.content', 'undefined') | list | length == 0
          - __kea_ssl_certificate_names | reject('match', __kea_ssl_certificate_name_pattern) | list | length == 0
          - __kea_ssl_certificate_names | unique | length == __kea_ssl_certificate_names | length
        fail_msg: >-
          Every entry in ssl_certificates needs certificate.content, key.content and a unique name
          that is safe as a file name (letters, digits, and . _ - *; no slashes, spaces or "..").
        quiet: true

    - name: Assert the chosen certificates are listed
      ansible.builtin.assert:
        that: __kea_tls_names | difference(__kea_ssl_certificate_names) | length == 0
        fail_msg: >-
          kea_api_tls_certificate and kea_ha_tls_certificate must name entries in ssl_certificates
          ({{ __kea_tls_names | difference(__kea_ssl_certificate_names) | join(', ') }}).
        quiet: true

    - name: Assert each certificate path has one source
      ansible.builtin.assert:
        that: __kea_tls_uses | map(attribute='cert') | unique | length == __kea_tls_uses | length
        fail_msg: >-
          kea_ha_tls_certificate differs from the API's certificate, but both use the same files.
          Give HA its own kea_ha_tls_cert_file and kea_ha_tls_key_file.
        quiet: true

- name: Assert API mode
  ansible.builtin.assert:
    that: kea_api_mode in ['auto', 'daemon', 'ctrl_agent']
    fail_msg: "kea_api_mode must be auto, daemon or ctrl_agent, not {{ kea_api_mode }}."
    quiet: true

- name: Assert a network-reachable API requires authentication
  ansible.builtin.assert:
    that: >-
      not (kea_api_enabled | bool)
      or kea_api_host is match('^(127\.|::1$|localhost$)')
      or kea_api_users | length > 0
      or kea_api_allow_unauthenticated | bool
    fail_msg: >-
      kea_api_host is {{ kea_api_host }}, so the API is reachable from the network,
      but kea_api_users is empty. Anyone who can reach it could reconfigure or stop
      Kea. Add kea_api_users, or set kea_api_allow_unauthenticated: true.
    quiet: true

- name: Assert ping check is available
  ansible.builtin.assert:
    that:
      - kea_dhcp4_enabled | bool
      - kea_install_source == 'isc' or ansible_facts['distribution_major_version'] | int >= 10
    fail_msg: >-
      kea_ping_check_enabled needs kea_dhcp4_enabled, and the ping_check hook,
      which ships with kea_install_source 'isc' or with AppStream's Kea on EL10
      but not with EPEL's Kea on EL8 or EL9.
    quiet: true
  when: kea_ping_check_enabled | bool

- name: Assert interfaces are set for every family that has subnets
  ansible.builtin.assert:
    that: >-
      not (item.enabled | bool) or item.interfaces | length > 0
      or (item.subnets | length == 0 and item.networks | length == 0)
    fail_msg: >-
      {{ item.family }} has subnets but no interfaces to serve them on. Set
      {{ item.var }}, e.g. [ens192], or ["*"] for every interface.
    quiet: true
  loop:
    - { family: DHCPv4, var: kea_dhcp4_interfaces, enabled: "{{ kea_dhcp4_enabled }}", interfaces: "{{ kea_dhcp4_interfaces }}",
        subnets: "{{ kea_dhcp4_subnets }}", networks: "{{ kea_dhcp4_shared_networks }}" }
    - { family: DHCPv6, var: kea_dhcp6_interfaces, enabled: "{{ kea_dhcp6_enabled }}", interfaces: "{{ kea_dhcp6_interfaces }}",
        subnets: "{{ kea_dhcp6_subnets }}", networks: "{{ kea_dhcp6_shared_networks }}" }
  loop_control:
    label: "{{ item.family }}"

- name: Assert every subnet has a unique id
  ansible.builtin.assert:
    that:
      - item.subnets | selectattr('id', 'undefined') | list | length == 0
      - item.subnets | map(attribute='id') | list | unique | length == item.subnets | length
    fail_msg: "Every {{ item.family }} subnet needs a unique 'id' (shared-network subnets included)."
    quiet: true
  loop:
    - family: DHCPv4
      subnets: "{{ kea_dhcp4_subnets + (kea_dhcp4_shared_networks | map(attribute='subnet4', default=[]) | flatten) }}"
    - family: DHCPv6
      subnets: "{{ kea_dhcp6_subnets + (kea_dhcp6_shared_networks | map(attribute='subnet6', default=[]) | flatten) }}"
  loop_control:
    label: "{{ item.family }}"

- name: Assert HA configuration
  when: kea_ha_enabled | bool
  block:
    - name: Assert HA mode and peers
      ansible.builtin.assert:
        that:
          - kea_ha_mode in ['hot-standby', 'load-balancing', 'passive-backup']
          - kea_ha_peers | length >= 2 or kea_ha_mode == 'passive-backup'
          - kea_ha_this_server_name in (kea_ha_peers | map(attribute='name') | list)
          - kea_ha_peers | selectattr('role', 'equalto', 'primary') | list | length == 1
          - kea_hook_lease_cmds | bool
        fail_msg: >-
          HA needs a valid kea_ha_mode, at least two kea_ha_peers with exactly one
          primary, this server ({{ kea_ha_this_server_name }}) listed among them, and
          kea_hook_lease_cmds enabled.
        quiet: true

    - name: Assert every peer has an address or url
      ansible.builtin.assert:
        that: item.url is defined or item.address is defined
        fail_msg: "HA peer {{ item.name }} needs 'address' or 'url'."
        quiet: true
      loop: "{{ kea_ha_peers }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Assert dedicated HA listener has multi-threading
      ansible.builtin.assert:
        that: not (kea_ha_dedicated_listener | bool) or (kea_multi_threading_enabled | bool)
        fail_msg: kea_ha_dedicated_listener requires kea_multi_threading_enabled.
        quiet: true

    - name: Assert HA TLS matches the endpoint peers connect to
      ansible.builtin.assert:
        that: kea_ha_dedicated_listener | bool or (kea_ha_tls_enabled | bool) == (kea_api_tls_enabled | bool)
        fail_msg: >-
          Without a dedicated HA listener, peers connect to kea-ctrl-agent, which serves
          HTTPS exactly when kea_api_tls_enabled is true. Set kea_ha_tls_enabled to the
          same value.
        quiet: true

    - name: Assert peers can reach the Control Agent
      ansible.builtin.assert:
        that:
          - kea_api_enabled | bool
          - kea_api_mode != 'daemon'
          - kea_api_host not in ['127.0.0.1', '::1', 'localhost']
        fail_msg: >-
          Without a dedicated HA listener, peers talk through kea-ctrl-agent, so
          the API must be enabled, kea_api_mode must not be 'daemon', and
          kea_api_host must be an address the other peers can reach.
        quiet: true
      when: not (kea_ha_dedicated_listener | bool)

- name: Assert DDNS configuration
  when: kea_ddns_enabled | bool
  ansible.builtin.assert:
    that:
      - kea_ddns_forward_domains | length > 0 or kea_ddns_reverse_domains | length > 0
      - not (kea_ddns_gss_tsig_enabled | bool) or kea_ddns_gss_tsig_server_principal | length > 0
      - not (kea_ddns_gss_tsig_enabled | bool) or kea_ddns_gss_tsig_client_principal | length > 0
    fail_msg: >-
      DDNS needs at least one forward or reverse domain, and GSS-TSIG needs
      kea_ddns_gss_tsig_server_principal and kea_ddns_gss_tsig_client_principal.
    quiet: true

- name: Assert phpIPAM sync prerequisites
  when: kea_phpipam_sync_enabled | bool
  ansible.builtin.assert:
    that:
      - kea_api_enabled | bool
      - kea_hook_host_cmds | bool
      - kea_hosts_database | length > 0
      - kea_phpipam_token | length > 0
      - kea_phpipam_subnet_map | length > 0
    fail_msg: >-
      phpIPAM sync needs the API (kea_api_enabled), the host_cmds hook, a hosts
      database (kea_hosts_database), kea_phpipam_token and kea_phpipam_subnet_map.
    quiet: true

- name: Assert FIPS mode is enabled
  ansible.builtin.assert:
    that: ansible_facts['fips'] | default(false) | bool
    fail_msg: >-
      kea_fips_required is set but the host is not in FIPS mode. Enable it with
      "fips-mode-setup --enable" (EL8/EL9) or install with fips=1 (EL10), then reboot.
    quiet: true
  when: kea_fips_required | bool

- name: Assert DDNS keys use FIPS-approved algorithms
  ansible.builtin.assert:
    that: >-
      kea_ddns_tsig_keys | map(attribute='algorithm', default='HMAC-MD5')
      | map('upper') | select('in', ['HMAC-MD5', 'HMAC-MD5.SIG-ALG.REG.INT']) | list | length == 0
    fail_msg: >-
      HMAC-MD5 TSIG keys are not allowed in FIPS mode. Use HMAC-SHA256 or stronger
      (Kea also defaults to HMAC-MD5 when a key has no algorithm).
    quiet: true
  when:
    - kea_ddns_enabled | bool
    - ansible_facts['fips'] | default(false) | bool or kea_fips_required | bool
