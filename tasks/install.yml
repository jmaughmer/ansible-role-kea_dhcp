---
- name: Build the package list
  ansible.builtin.set_fact:
    __kea_packages: >-
      {{
        (__kea_source.common_packages
         + ([__kea_source.dhcp4_package] if kea_dhcp4_enabled | bool else [])
         + ([__kea_source.dhcp6_package] if kea_dhcp6_enabled | bool else [])
         + ([__kea_source.ddns_package] if kea_ddns_enabled | bool else [])
         + (__kea_source.mysql_packages if __kea_db_types is contains('mysql') else [])
         + (__kea_source.pgsql_packages if __kea_db_types is contains('postgresql') else [])
         + (['mariadb'] if kea_db_init | bool and __kea_db_types is contains('mysql') else [])
         + (['postgresql'] if kea_db_init | bool and __kea_db_types is contains('postgresql') else [])
         + (['krb5-workstation'] if kea_ddns_enabled | bool and kea_ddns_gss_tsig_enabled | bool else [])
         + (['python3'] if kea_phpipam_sync_enabled | bool else [])
         + ['iproute']
         + kea_extra_packages) | unique
      }}
  vars:
    __kea_db_types: >-
      {{ [kea_dhcp4_lease_database, kea_dhcp6_lease_database,
          kea_dhcp4_hosts_database, kea_dhcp6_hosts_database]
         | map(attribute='type', default='') | list }}

- name: Install Kea packages
  ansible.builtin.dnf:
    name: "{{ __kea_packages }}"
    state: "{{ kea_package_state }}"
  notify: Restart kea

- name: Detect the installed Kea version
  ansible.builtin.command: "{{ 'kea-dhcp4' if kea_dhcp4_enabled | bool else 'kea-dhcp6' }} -v"
  register: __kea_version_cmd
  changed_when: false
  failed_when: __kea_version_cmd.rc != 0 and not ansible_check_mode
  check_mode: false

- name: Look up the Kea service account
  ansible.builtin.command: getent passwd kea _kea
  register: __kea_account
  changed_when: false
  failed_when: false
  check_mode: false

- name: Set Kea facts
  ansible.builtin.set_fact:
    __kea_version: "{{ __kea_version_cmd.stdout | trim | regex_search('^[0-9]+\\.[0-9]+\\.[0-9]+') | default('3.0.0', true) }}"
    __kea_user: "{{ kea_user if kea_user | length > 0 else (__kea_account.stdout_lines | first | default('root:') | split(':') | first) }}"

- name: Set the Kea group
  ansible.builtin.set_fact:
    __kea_group: "{{ kea_group if kea_group | length > 0 else __kea_user }}"

# Kea 2.7.2 moved the API into the daemons and deprecated kea-ctrl-agent. HA
# without a dedicated listener still reaches its peers through the agent.
- name: Choose where the API is served from
  ansible.builtin.set_fact:
    __kea_api_daemon: >-
      {{ kea_api_enabled | bool
         and (kea_api_mode == 'daemon'
              or (kea_api_mode == 'auto'
                  and __kea_version is version('2.7.2', '>=')
                  and not (kea_ha_enabled | bool and not (kea_ha_dedicated_listener | bool)))) }}

- name: Set whether kea-ctrl-agent runs
  ansible.builtin.set_fact:
    __kea_ctrl_agent_active: "{{ kea_api_enabled | bool and not __kea_api_daemon | bool }}"

- name: Assert the daemons can serve the API
  ansible.builtin.assert:
    that:
      - __kea_version is version('2.7.2', '>=')
      - not (kea_ha_enabled | bool and not (kea_ha_dedicated_listener | bool))
    fail_msg: >-
      kea_api_mode 'daemon' needs Kea 2.7.2 or newer (this is {{ __kea_version }}),
      and HA with kea_ha_dedicated_listener, since HA otherwise reaches its peers
      through kea-ctrl-agent. Use kea_api_mode 'auto' or 'ctrl_agent'.
    quiet: true
  when: kea_api_enabled | bool and kea_api_mode == 'daemon'

- name: Install kea-ctrl-agent
  ansible.builtin.dnf:
    name: "{{ __kea_source.ctrl_agent_package }}"
    state: "{{ kea_package_state }}"
  when: __kea_ctrl_agent_active | bool
  notify: Restart kea

- name: Show what was installed
  ansible.builtin.debug:
    msg: "Kea {{ __kea_version }} ({{ kea_install_source }}), running as {{ __kea_user }}:{{ __kea_group }}"
