---
- name: Install the phpIPAM sync script
  ansible.builtin.copy:
    src: kea-phpipam-sync.py
    dest: /usr/local/libexec/kea-phpipam-sync
    owner: root
    group: root
    mode: "0755"

- name: Write the phpIPAM sync configuration
  ansible.builtin.copy:
    content: "{{ __kea_phpipam_sync_config | to_nice_json(indent=2) }}\n"
    dest: "{{ kea_config_dir }}/kea-phpipam-sync.json"
    owner: root
    group: "{{ __kea_group }}"
    mode: "0640"
  vars:
    __kea_phpipam_sync_config:
      phpipam_url: "{{ kea_phpipam_url }}"
      phpipam_app_id: "{{ kea_phpipam_app_id }}"
      phpipam_token: "{{ kea_phpipam_token }}"
      phpipam_verify_tls: "{{ kea_phpipam_verify_tls | bool }}"
      # kea_phpipam_api_url (a single URL) is the older setting.
      kea_api_urls: >-
        {{ kea_phpipam_api_urls if kea_phpipam_api_urls | length > 0
           else ({'dhcp4': kea_phpipam_api_url, 'dhcp6': kea_phpipam_api_url} if kea_phpipam_api_url is defined
                 else __kea_api_urls) }}
      kea_api_user: "{{ kea_phpipam_api_user }}"
      kea_api_password: "{{ kea_phpipam_api_password }}"
      kea_api_verify_tls: "{{ kea_phpipam_api_verify_tls | bool }}"
      kea_api_ca_file: "{{ kea_phpipam_api_ca_file }}"
      kea_api_cert_file: "{{ kea_phpipam_api_cert_file }}"
      kea_api_key_file: "{{ kea_phpipam_api_key_file }}"
      phpipam_ca_file: "{{ kea_phpipam_ca_file }}"
      delete_missing: "{{ kea_phpipam_delete_missing | bool }}"
      allow_empty_source: "{{ kea_phpipam_allow_empty_source | bool }}"
      max_deletes: "{{ kea_phpipam_max_deletes | int }}"
      subnet_map: "{{ kea_phpipam_subnet_map }}"
  no_log: true

- name: Install the phpIPAM sync units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - kea-phpipam-sync.service
    - kea-phpipam-sync.timer
  notify: Restart kea-phpipam-sync timer
