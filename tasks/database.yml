---
# kea-admin creates or upgrades the schema of every SQL database Kea uses:
# lease and hosts databases of both families, each distinct one once. The
# databases and their users must already exist.
- name: Manage the schema of each Kea database
  ansible.builtin.include_tasks: database_schema.yml
  loop: "{{ __kea_sql_databases }}"
  loop_control:
    loop_var: __kea_db
    label: "{{ __kea_db.type }}://{{ __kea_db.host | default('localhost') }}/{{ __kea_db.name }}"
