---
name: CI

"on":
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ansible-core ansible-lint yamllint
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint

  molecule:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { scenario: default, ansible: "ansible-core" }
          - { scenario: ha, ansible: "ansible-core" }
          # EL8's Python 3.6 dnf bindings need ansible-core 2.16.
          - { scenario: el8, ansible: "ansible-core>=2.16,<2.17" }
    steps:
      - uses: actions/checkout@v4
        with:
          path: ansible-role-kea_dhcp
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install "${{ matrix.ansible }}" molecule "molecule-plugins[docker]" docker
      - name: Install collections
        working-directory: ansible-role-kea_dhcp
        run: ansible-galaxy collection install -r requirements.yml
      - name: Run molecule
        working-directory: ansible-role-kea_dhcp
        run: molecule test -s ${{ matrix.scenario }}
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
