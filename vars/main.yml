---
__kea_supported_major_versions: ["8", "9", "10"]

# Certificates from ssl_certificates. Only the names are read here, so these
# can't carry a private key.
__kea_ssl_certificate_names: "{{ ssl_certificates | map(attribute='name', default='') | list }}"
# The name becomes a file name.
__kea_ssl_certificate_name_pattern: '^(?!.*\.\.)[A-Za-z0-9_*][A-Za-z0-9._*-]*$'
__kea_default_tls_certificate: >-
  {{ ansible_facts['fqdn'] if ansible_facts['fqdn'] in __kea_ssl_certificate_names
     else __kea_ssl_certificate_names | first | default('') }}
__kea_tls_dir: "{{ kea_config_dir }}/tls"
# One entry for each listener with TLS on, when the list isn't empty.
__kea_tls_uses: >-
  {{ [] if ssl_certificates | length == 0 else
     (([{'name': kea_api_tls_certificate if kea_api_tls_certificate | length > 0 else __kea_default_tls_certificate,
         'cert': kea_api_tls_cert_file, 'key': kea_api_tls_key_file}]
       if kea_api_tls_enabled | bool else [])
      + ([{'name': kea_ha_tls_certificate if kea_ha_tls_certificate | length > 0 else __kea_default_tls_certificate,
           'cert': kea_ha_tls_cert_file, 'key': kea_ha_tls_key_file}]
         if kea_ha_enabled | bool and kea_ha_tls_enabled | bool else [])) | unique }}
__kea_tls_names: "{{ __kea_tls_uses | map(attribute='name') | unique }}"
# Variables earlier releases read, which no longer do anything.
__kea_removed_tls_variables: '^kea_(api|ctrl_agent|ha)_tls_(cert|key)_content$'

# Package and unit names per install source.
__kea_sources:
  isc:
    common_packages: [isc-kea-common, isc-kea-hooks, isc-kea-admin]
    dhcp4_package: isc-kea-dhcp4
    dhcp6_package: isc-kea-dhcp6
    ddns_package: isc-kea-dhcp-ddns
    ctrl_agent_package: isc-kea-ctrl-agent
    mysql_packages: [isc-kea-mysql]
    pgsql_packages: [isc-kea-pgsql]
    dhcp4_service: kea-dhcp4
    dhcp6_service: kea-dhcp6
    ddns_service: kea-dhcp-ddns
    ctrl_agent_service: kea-ctrl-agent
  distro:
    common_packages: [kea, kea-hooks]
    dhcp4_package: kea
    dhcp6_package: kea
    ddns_package: kea
    ctrl_agent_package: kea
    mysql_packages: []
    pgsql_packages: []
    dhcp4_service: kea-dhcp4
    dhcp6_service: kea-dhcp6
    ddns_service: kea-dhcp-ddns
    ctrl_agent_service: kea-ctrl-agent

__kea_source: "{{ __kea_sources[kea_install_source] }}"
# Kea 3.x only accepts sockets under its compiled-in directory, which is
# /var/run/kea for both ISC's and AppStream's builds (EL10 rejects /run/kea
# even though it is the same directory).
__kea_socket_dir: /var/run/kea
__kea_hooks_dir: /usr/lib64/kea/hooks

__kea_dhcp4_socket: "{{ kea_socket_dir }}/kea4-ctrl-socket"
__kea_dhcp6_socket: "{{ kea_socket_dir }}/kea6-ctrl-socket"
__kea_ddns_socket: "{{ kea_socket_dir }}/kea-ddns-ctrl-socket"

# ISC's recommended multi-threading settings per lease backend (Kea ARM,
# "Multi-Threading Settings With Different Database Backends").
__kea_mt_recommended:
  dhcp4:
    memfile: { thread-pool-size: 4, packet-queue-size: 28 }
    mysql: { thread-pool-size: 12, packet-queue-size: 792 }
    postgresql: { thread-pool-size: 8, packet-queue-size: 88 }
  dhcp6:
    memfile: { thread-pool-size: 4, packet-queue-size: 160 }
    mysql: { thread-pool-size: 6, packet-queue-size: 336 }
    postgresql: { thread-pool-size: 6, packet-queue-size: 48 }

# Hook library file names.
__kea_hook_files:
  lease_cmds: libdhcp_lease_cmds.so
  host_cmds: libdhcp_host_cmds.so
  stat_cmds: libdhcp_stat_cmds.so
  subnet_cmds: libdhcp_subnet_cmds.so
  ha: libdhcp_ha.so
  legal_log: libdhcp_legal_log.so
  ping_check: libdhcp_ping_check.so
  mysql: libdhcp_mysql.so
  pgsql: libdhcp_pgsql.so
  gss_tsig: libddns_gss_tsig.so

__kea_enabled_services: >-
  {{ ([__kea_source.dhcp4_service] if kea_dhcp4_enabled | bool else [])
     + ([__kea_source.dhcp6_service] if kea_dhcp6_enabled | bool else [])
     + ([__kea_source.ddns_service] if kea_ddns_enabled | bool else [])
     + ([__kea_source.ctrl_agent_service] if __kea_ctrl_agent_active | default(false) | bool else []) }}

__kea_db_backend_args:
  mysql: mysql
  postgresql: pgsql

# Every SQL database Kea uses, for kea-admin (kea_db_init).
__kea_sql_databases: >-
  {{ ((([kea_dhcp4_lease_database, kea_dhcp4_hosts_database] if kea_dhcp4_enabled | bool else [])
       + ([kea_dhcp6_lease_database, kea_dhcp6_hosts_database] if kea_dhcp6_enabled | bool else []))
      | select('mapping') | selectattr('type', 'defined')
      | selectattr('type', 'in', ['mysql', 'postgresql']) | unique) }}

# TCP ports the API listens on: one per daemon, or kea-ctrl-agent's.
__kea_api_ports: >-
  {{ (([kea_api_dhcp4_port | string] if kea_dhcp4_enabled | bool else [])
      + ([kea_api_dhcp6_port | string] if kea_dhcp6_enabled | bool else [])
      + ([kea_api_ddns_port | string] if kea_ddns_enabled | bool else []))
     if __kea_api_daemon | default(false) | bool
     else ([kea_ctrl_agent_port | string] if __kea_ctrl_agent_active | default(false) | bool else []) }}

# Local URL of the API for each service.
__kea_api_client_host: >-
  {{ '127.0.0.1' if kea_api_host in ['0.0.0.0', ''] else ('::1' if kea_api_host == '::' else kea_api_host) }}
__kea_api_base: >-
  {{ ('https' if kea_api_tls_enabled | bool else 'http') ~ '://'
     ~ (('[' ~ __kea_api_client_host ~ ']') if ':' in __kea_api_client_host else __kea_api_client_host) }}
__kea_api_urls: >-
  {{ {'dhcp4': __kea_api_base ~ ':' ~ kea_api_dhcp4_port ~ '/',
      'dhcp6': __kea_api_base ~ ':' ~ kea_api_dhcp6_port ~ '/',
      'd2': __kea_api_base ~ ':' ~ kea_api_ddns_port ~ '/'}
     if __kea_api_daemon | default(false) | bool
     else {'dhcp4': __kea_api_base ~ ':' ~ kea_ctrl_agent_port ~ '/',
           'dhcp6': __kea_api_base ~ ':' ~ kea_ctrl_agent_port ~ '/',
           'd2': __kea_api_base ~ ':' ~ kea_ctrl_agent_port ~ '/'} }}

# TCP ports HA peers connect to: the dedicated listeners, or kea-ctrl-agent.
__kea_ha_ports: >-
  {{ ([] if not kea_ha_enabled | bool
      else ((([kea_ha_dhcp4_port | string] if kea_dhcp4_enabled | bool else [])
             + ([kea_ha_dhcp6_port | string] if kea_dhcp6_enabled | bool else []))
            if kea_ha_dedicated_listener | bool else [kea_ctrl_agent_port | string])) }}

# Addresses of the HA peers, from "address" or the host part of "url".
__kea_ha_peer_addresses: >-
  {{ kea_ha_peers | map(attribute='address', default='') | map('string') | select | list
     + (kea_ha_peers | selectattr('address', 'undefined') | map(attribute='url', default='')
        | select | map('urlsplit', 'hostname') | list) }}

# Ports opened to the whole firewall zone.
__kea_firewall_open_ports: >-
  {{ ((__kea_api_ports if kea_firewalld_open_api | bool else [])
      + (__kea_ha_ports if not (kea_firewalld_ha_restrict_to_peers | bool) else []))
     | unique }}

# Rich rules accepting HA traffic from each peer only.
__kea_firewall_rich_rules: >-
  {%- set rules = [] -%}
  {%- if kea_firewalld_ha_restrict_to_peers | bool -%}
  {%- for addr in __kea_ha_peer_addresses -%}
  {%- for port in __kea_ha_ports | difference(__kea_firewall_open_ports) -%}
  {%- set _ = rules.append('rule family="' ~ ('ipv6' if ':' in addr else 'ipv4') ~ '" source address="' ~ addr
                           ~ '" port port="' ~ port ~ '" protocol="tcp" accept') -%}
  {%- endfor -%}
  {%- endfor -%}
  {%- endif -%}
  {{ rules }}

# Every TCP port the role may have opened, to find ones no longer needed.
__kea_known_tcp_ports: >-
  {{ [kea_ctrl_agent_port, kea_api_dhcp4_port, kea_api_dhcp6_port, kea_api_ddns_port,
      kea_ha_dhcp4_port, kea_ha_dhcp6_port] | map('string') | unique }}

__kea_all_services:
  - "{{ __kea_source.dhcp4_service }}"
  - "{{ __kea_source.dhcp6_service }}"
  - "{{ __kea_source.ddns_service }}"
  - "{{ __kea_source.ctrl_agent_service }}"

# TCP ports Kea listens on (not deduplicated, so clashes can be caught).
__kea_listen_tcp_ports: >-
  {{ __kea_api_ports
     + ([kea_ha_dhcp4_port | string] if kea_ha_enabled | bool and kea_ha_dedicated_listener | bool and kea_dhcp4_enabled | bool else [])
     + ([kea_ha_dhcp6_port | string] if kea_ha_enabled | bool and kea_ha_dedicated_listener | bool and kea_dhcp6_enabled | bool else []) }}

# UDP ports Kea listens on: DHCPv4 server, DHCPv6 server, DDNS requests.
__kea_listen_udp_ports: >-
  {{ (['67'] if kea_dhcp4_enabled | bool else [])
     + (['547'] if kea_dhcp6_enabled | bool else [])
     + ([kea_ddns_port | string] if kea_ddns_enabled | bool else []) }}

# TCP ports Kea listens on, which SELinux must allow it to bind.
__kea_selinux_ports: "{{ __kea_listen_tcp_ports | unique }}"

# Files deployed outside of RPMs that fapolicyd must trust.
__kea_fapolicyd_files: >-
  {{ (['/usr/local/libexec/kea-phpipam-sync'] if kea_phpipam_sync_enabled | bool else [])
     + kea_fapolicyd_trusted_files }}
